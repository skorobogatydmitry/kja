name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build & publish artifacts for
        required: true
        type: string

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build
        run: cargo build --target x86_64-unknown-linux-gnu --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kja-linux
          path: target/x86_64-unknown-linux-gnu/release/kja
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Build
        uses: ./.github/actions/android-build
        with:
          target: aarch64-linux-android
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kja-android
          path: target/aarch64-linux-android/release/kja
          if-no-files-found: error

  release:
    needs:
      - build-linux
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kja-linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: kja-android
          path: android
      - name: Add arch to binary names
        run: |
          mv android/kja kja-android-aarch64
          mv linux/kja kja-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: kja-*
